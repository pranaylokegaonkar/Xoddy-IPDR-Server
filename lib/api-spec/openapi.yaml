openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Xoddy IPDR Server API - MikroTik Traffic Flow (NetFlow/IPFIX) collector
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard summaries and analytics
  - name: auth
    description: Authentication and sessions
  - name: audit
    description: System activity / audit log
  - name: users
    description: System users and user types
  - name: nas
    description: NAS (Network Access Server) management
  - name: flows
    description: IPDR flow records search and export
  - name: notifications
    description: Notification and alerting system
  - name: archives
    description: Compressed flow record archives
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary metrics
      responses:
        "200":
          description: Summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/flow-trend:
    get:
      operationId: getFlowTrend
      tags: [dashboard]
      summary: Flow volume trend over the last 24 hours
      responses:
        "200":
          description: Trend points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowTrendPoint"
  /dashboard/top-talkers:
    get:
      operationId: getTopTalkers
      tags: [dashboard]
      summary: Top source IP addresses by traffic volume (last 24 hours)
      responses:
        "200":
          description: Top talkers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TopTalker"
  /dashboard/system-resources:
    get:
      operationId: getSystemResources
      tags: [dashboard]
      summary: Host disk space and RAM usage of the collector server
      responses:
        "200":
          description: System resource usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemResources"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Authenticate and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End the current session
      responses:
        "204":
          description: Logged out
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /audit-logs:
    get:
      operationId: getAuditLogs
      tags: [audit]
      summary: List system activity / audit log entries
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer }
        - name: action
          in: query
          required: false
          schema: { type: string }
        - name: userId
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Paginated audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
  /archive-logs:
    get:
      operationId: getArchiveLogs
      tags: [archives]
      summary: List archive / compression activity log entries
      parameters:
        - name: page
          in: query
          required: false
          schema: { type: integer }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer }
        - name: level
          in: query
          required: false
          schema: { type: string, enum: [info, warning, error] }
      responses:
        "200":
          description: Paginated archive/compression log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveLogPage"
  /user-types:
    get:
      operationId: getUserTypes
      tags: [users]
      summary: List available user types
      responses:
        "200":
          description: User types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserType"
  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List system users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemUser"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a system user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a system user
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUser"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a system user
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemUser"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a system user
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /nas:
    get:
      operationId: getNasList
      tags: [nas]
      summary: List NAS devices
      responses:
        "200":
          description: NAS devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Nas"
    post:
      operationId: createNas
      tags: [nas]
      summary: Add a NAS device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NasInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nas"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /nas/{id}:
    get:
      operationId: getNas
      tags: [nas]
      summary: Get a NAS device
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: NAS device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nas"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateNas
      tags: [nas]
      summary: Update a NAS device
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NasUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nas"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteNas
      tags: [nas]
      summary: Delete a NAS device
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /nas/{id}/status:
    patch:
      operationId: setNasStatus
      tags: [nas]
      summary: Enable or disable a NAS device
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NasStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nas"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /nas/{id}/config:
    get:
      operationId: getNasConfig
      tags: [nas]
      summary: Generate MikroTik traffic-flow sync configuration for a NAS
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Sync configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NasConfig"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /nas/{id}/flows:
    delete:
      operationId: deleteNasFlows
      tags: [nas]
      summary: Start background deletion of a NAS device's unarchived flow records
      description: >-
        Removes only not-yet-compressed (unarchived) flow records; already
        archived batches are kept. Poll the deletion-status endpoint for progress.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "202":
          description: Deletion started; poll the deletion-status endpoint for progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionStarted"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /nas/{id}/flows/all:
    delete:
      operationId: deleteAllNasFlows
      tags: [nas]
      summary: Start background deletion of ALL of a NAS device's flow records
      description: >-
        Removes every flow record for the NAS (archived + unarchived). The
        durable gzip archive files remain available on the Archives page, so no
        IPDR data is lost — only the redundant hot-table rows are purged. Poll
        the deletion-status endpoint for progress.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "202":
          description: Deletion started; poll the deletion-status endpoint for progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionStarted"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /nas/{id}/flows/deletion-status:
    get:
      operationId: getNasFlowDeletionStatus
      tags: [nas]
      summary: Live status of a NAS device's unarchived flow deletion
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Current deletion progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NasFlowDeletionStatus"

  /flows:
    delete:
      operationId: deleteAllFlows
      tags: [flows]
      summary: Start background deletion of all already-archived flow records (all NAS)
      description: >-
        Purges every already-compressed (archived) row from `flow_records` across
        all NAS devices, freeing the hot table. The durable gzip archive files on
        the Archives page are kept, so no IPDR data is lost. Not-yet-compressed
        (unarchived) rows are left untouched for the compression job. Runs in the
        background; poll the deletion-status endpoint for progress.
      responses:
        "202":
          description: Deletion started; poll the deletion-status endpoint for progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionStarted"
  /flows/deletion-status:
    get:
      operationId: getAllFlowDeletionStatus
      tags: [flows]
      summary: Live status of the global archived-flow deletion
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllFlowDeletionStatus"
  /flows/search:
    post:
      operationId: searchFlows
      tags: [flows]
      summary: Search IPDR flow records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowSearch"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowSearchResult"
  /flows/export:
    post:
      operationId: exportFlows
      tags: [flows]
      summary: Export IPDR flow records as text or Excel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowExport"
      responses:
        "200":
          description: Exported file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /notifications:
    get:
      operationId: getNotifications
      tags: [notifications]
      summary: List notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark a notification as read
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: Updated count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountResult"

  /archives:
    get:
      operationId: getArchives
      tags: [archives]
      summary: List compressed flow archives
      parameters:
        - $ref: "#/components/parameters/ArchiveNasId"
        - name: startDate
          in: query
          required: false
          description: Include archive windows starting on or after this IST calendar date (YYYY-MM-DD).
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
        - name: endDate
          in: query
          required: false
          description: Include archive windows starting on or before this IST calendar date (YYYY-MM-DD).
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
      responses:
        "200":
          description: Archives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowArchive"
        "400":
          description: Invalid date filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /archives/nas-options:
    get:
      operationId: getArchiveNasOptions
      tags: [archives]
      summary: List current and historical archive NAS devices without flow counts
      responses:
        "200":
          description: Available NAS filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ArchiveNasOption"
  /archives/coverage:
    get:
      operationId: getArchiveCoverage
      tags: [archives]
      summary: Latest archived data period for all or one NAS
      parameters:
        - $ref: "#/components/parameters/ArchiveNasId"
      responses:
        "200":
          description: Latest archive period end, independent of date filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveCoverage"
        "400":
          description: Invalid NAS filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /archives/compress:
    post:
      operationId: runCompression
      tags: [archives]
      summary: Run flow record compression now
      responses:
        "202":
          description: Compression started in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompressionStarted"
  /archives/compress/status:
    get:
      operationId: getCompressionStatus
      tags: [archives]
      summary: Live status of the background compression run
      responses:
        "200":
          description: Current compression progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompressionStatus"
  /archives/delete:
    post:
      operationId: deleteArchives
      tags: [archives]
      summary: Delete multiple archives by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteArchivesInput"
      responses:
        "200":
          description: Number of archives deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
  /archives/{id}:
    delete:
      operationId: deleteArchive
      tags: [archives]
      summary: Delete a single archive
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    ArchiveNasId:
      name: nasId
      in: query
      required: false
      description: Restrict results to this NAS. Omit to include all devices and legacy combined archives.
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    ArchiveNasOption:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        ipAddress: { type: ["string", "null"] }
      required: [id, name, ipAddress]
    ArchiveCoverage:
      type: object
      properties:
        latestPeriodEnd:
          type: ["string", "null"]
          format: date-time
          description: Latest archived window end, not the archive creation time. Null when there are no archives.
      required:
        - latestPeriodEnd
    CompressionStarted:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
      required:
        - status
        - message
    CompressionStatus:
      type: object
      properties:
        running:
          type: boolean
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        currentFileName:
          type: string
          nullable: true
        currentPeriodStart:
          type: string
          format: date-time
          nullable: true
        currentPeriodEnd:
          type: string
          format: date-time
          nullable: true
        completedCount:
          type: integer
        progressPercent:
          type: number
          nullable: true
        elapsedSeconds:
          type: integer
          nullable: true
        etaSeconds:
          type: integer
          nullable: true
        lastError:
          type: string
          nullable: true
      required:
        - running
        - completedCount
    CountResult:
      type: object
      properties:
        count:
          type: integer
      required:
        - count

    DashboardSummary:
      type: object
      required:
        - totalFlows
        - flowsToday
        - totalNas
        - activeNas
        - inactiveNas
        - totalBytes
        - unreadNotifications
        - archivedBatches
        - collectorPort
      properties:
        totalFlows: { type: integer }
        flowsToday: { type: integer }
        totalNas: { type: integer }
        activeNas: { type: integer }
        inactiveNas: { type: integer }
        totalBytes: { type: integer }
        unreadNotifications: { type: integer }
        archivedBatches: { type: integer }
        collectorPort: { type: integer }
        lastFlowAt: { type: ["string", "null"], format: date-time }
    FlowTrendPoint:
      type: object
      required: [time, count, bytes]
      properties:
        time: { type: string }
        count: { type: integer }
        bytes: { type: integer }
    TopTalker:
      type: object
      required: [ip, count, bytes]
      properties:
        ip: { type: string }
        count: { type: integer }
        bytes: { type: integer }
    ResourceUsage:
      type: object
      required: [total, used, free, percent]
      properties:
        total: { type: integer }
        used: { type: integer }
        free: { type: integer }
        percent: { type: number }
    SystemResources:
      type: object
      required: [disk, memory]
      properties:
        disk: { $ref: "#/components/schemas/ResourceUsage" }
        memory: { $ref: "#/components/schemas/ResourceUsage" }

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    CurrentUser:
      type: object
      required: [id, username, fullName, userType]
      properties:
        id: { type: integer }
        username: { type: string }
        fullName: { type: string }
        email: { type: ["string", "null"] }
        userType: { type: string, enum: [admin, operator, viewer] }
        token:
          type: string
          description: >-
            Bearer token (signed session id) returned by the login endpoint so
            clients can authenticate without the session cookie. Only present on
            the login response.
    AuditLog:
      type: object
      required: [id, username, action, createdAt]
      properties:
        id: { type: integer }
        userId: { type: ["integer", "null"] }
        username: { type: string }
        action: { type: string }
        detail: { type: ["string", "null"] }
        ipAddress: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    AuditLogPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    ArchiveLog:
      type: object
      required: [id, level, event, message, createdAt]
      properties:
        id: { type: integer }
        level: { type: string, enum: [info, warning, error] }
        event: { type: string }
        message: { type: string }
        detail: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    ArchiveLogPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveLog"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    UserType:
      type: object
      required: [value, label, description]
      properties:
        value: { type: string }
        label: { type: string }
        description: { type: string }
    SystemUser:
      type: object
      required: [id, username, fullName, userType, enabled, createdAt]
      properties:
        id: { type: integer }
        username: { type: string }
        fullName: { type: string }
        email: { type: ["string", "null"] }
        userType: { type: string, enum: [admin, operator, viewer] }
        enabled: { type: boolean }
        lastLoginAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    UserInput:
      type: object
      required: [username, fullName, userType, password]
      properties:
        username: { type: string, minLength: 1 }
        fullName: { type: string, minLength: 1 }
        email: { type: string }
        userType: { type: string, enum: [admin, operator, viewer] }
        password: { type: string, minLength: 4 }
        enabled: { type: boolean }
    UserUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 1 }
        email: { type: string }
        userType: { type: string, enum: [admin, operator, viewer] }
        password: { type: string, minLength: 4 }
        enabled: { type: boolean }

    Nas:
