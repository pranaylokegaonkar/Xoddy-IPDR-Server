        deletedCount: { type: integer }
        progressPercent:
          type: number
          nullable: true
        elapsedSeconds:
          type: integer
          nullable: true
        etaSeconds:
          type: integer
          nullable: true
        lastError:
          type: string
          nullable: true

    NasFlowDeletionStatus:
      type: object
      required: [nasId, running, totalCount, deletedCount, scope]
