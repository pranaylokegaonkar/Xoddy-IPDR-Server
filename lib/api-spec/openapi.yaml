        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        totalCount: { type: integer }
        deletedCount: { type: integer }
        progressPercent:
          type: number
          nullable: true
        elapsedSeconds:
          type: integer
          nullable: true
        etaSeconds:
          type: integer
          nullable: true
        lastError:
          type: string
          nullable: true
