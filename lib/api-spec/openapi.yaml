        location: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        flowVersion: { type: string, enum: [v1, v5, v9, ipfix] }
        enabled: { type: boolean }
        status: { type: string, enum: [active, inactive, never] }
        lastSeenAt: { type: ["string", "null"], format: date-time }
        flowCount: { type: integer }
        createdAt: { type: string, format: date-time }
    NasInput:
      type: object
      required: [name, ipAddress, flowVersion]
      properties:
        name: { type: string, minLength: 1 }
        ipAddress: { type: string, minLength: 1 }
        location: { type: string }
        description: { type: string }
        flowVersion: { type: string, enum: [v1, v5, v9, ipfix] }
        enabled: { type: boolean }
    NasUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        ipAddress: { type: string, minLength: 1 }
        location: { type: string }
        description: { type: string }
        flowVersion: { type: string, enum: [v1, v5, v9, ipfix] }
        enabled: { type: boolean }
    NasStatusUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    NasConfig:
      type: object
      required: [nasId, nasName, flowVersion, collectorHost, collectorPort, commands, notes]
      properties:
        nasId: { type: integer }
        nasName: { type: string }
        flowVersion: { type: string }
        collectorHost: { type: string }
        collectorPort: { type: integer }
        commands:
          type: array
          items: { type: string }
        notes: { type: string }

    FlowRecord:
      type: object
      required:
        - id
        - nasId
        - nasName
        - srcIp
        - dstIp
        - srcPort
        - dstPort
        - protocol
        - protocolName
        - bytes
        - packets
        - flowVersion
        - startTime
        - endTime
        - flowDate
      properties:
        id: { type: integer }
        nasId: { type: integer }
        nasName: { type: string }
        srcIp: { type: string }
        dstIp: { type: string }
        srcNatIp: { type: ["string", "null"] }
        dstNatIp: { type: ["string", "null"] }
        srcPort: { type: integer }
        dstPort: { type: integer }
        protocol: { type: integer }
        protocolName: { type: string }
        bytes: { type: integer }
        packets: { type: integer }
        flowVersion: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        flowDate: { type: string }
    FlowSearch:
      type: object
      properties:
        srcIp: { type: string }
        dstIp: { type: string }
        srcNatIp: { type: string }
        dstNatIp: { type: string }
        nasId: { type: integer }
        dateFrom: { type: string }
        dateTo: { type: string }
        startTime: { type: string }
        endTime: { type: string }
        page: { type: integer }
        pageSize: { type: integer }
    FlowSearchResult:
      type: object
      required: [records, total, page, pageSize]
      properties:
        records:
          type: array
